name: flutter_frappe_chat
description: Frappe Chat for Flutter. Realtime messaging over Socket.IO, attachments, voice notes, typing indicators and a themeable chat screen for Frappe/ERPNext sites.
version: 1.1.0
homepage: https://github.com/handoud/flutter_frappe_chat
repository: https://github.com/handoud/flutter_frappe_chat
issue_tracker: https://github.com/handoud/flutter_frappe_chat/issues
topics:
  - frappe
  - erpnext
  - chat
  - websocket
  - realtime

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  socket_io_client: ^3.0.0
  http: ^1.2.0

  # Files and media
  # file_picker 12+ requires Dart 3.10; bump when you move to Flutter 3.35+.
  file_picker: ^11.0.0
  image_picker: ^1.0.4
  path_provider: ^2.1.2

  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^13.0.0

  # UI
  intl: ^0.20.2
  cached_network_image: ^3.3.0
  url_launcher: ^6.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/sounds/message.mp3
